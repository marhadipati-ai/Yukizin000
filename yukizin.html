<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Yukizin — mockup aplikasi v2 (prototipe tanpa backend).
  Keamanan: halaman ini TIDAK memuat sumber eksternal, TIDAK memanggil API,
  TIDAK menyimpan data ke localStorage/cookie, dan TIDAK mengirim data ke mana pun.
  Ringkasan aturan diperbarui per 27 Oktober 2026; tarif uji lab adalah angka contoh.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14274E">
<title>Yukizin — Mockup Aplikasi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 34 34%27%3E%3Crect width=%2734%27 height=%2734%27 rx=%2710%27 fill=%27%2314274E%27/%3E%3Crect x=%2713.5%27 y=%276%27 width=%277%27 height=%2715%27 rx=%273.5%27 fill=%27%23F7B955%27/%3E%3Ccircle cx=%2717%27 cy=%2726.5%27 r=%273.6%27 fill=%27%23F7B955%27/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0F1C38; --muted:#556178; --teal:#14274E; --teal-d:#0C1A38; --mint:#E3EDFA;
  --amber:#F7B955; --amber-bg:#FEF4E1; --amber-ink:#6B4300; --bg:#F4F7FB; --card:#FFFFFF;
  --line:#DCE3EE; --danger:#B42318; --danger-bg:#FDECEA; --ok:#0E6B45; --ok-bg:#E3F3EA; --blue:#0B5CAD;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:#E4E9F2;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.device{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:28px}
.pad{padding:0 16px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
h1,h2,h3,p{margin:0}
.h1{font-size:23px;line-height:1.25;font-weight:800;letter-spacing:-.3px;margin:6px 0 6px}
.h2{font-size:17px;font-weight:700;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.ic{flex:none;display:block}
.gh{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--teal);text-transform:uppercase;margin:18px 0 8px}

.topbar{display:flex;align-items:center;gap:6px;min-height:56px;padding:6px 10px 4px;background:var(--bg);position:sticky;top:0;z-index:5}
.topbar .title{font-size:16px;font-weight:700;flex:1;text-align:center;margin-right:44px}
.topbar.noback .title{margin-right:0;text-align:left;padding-left:8px;font-size:19px;font-weight:800}
.topbar.has-right .title{margin-right:0}
.iconbtn{width:44px;height:44px;border:none;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--teal);position:relative;flex:none}
.iconbtn:hover{background:var(--mint)}
.dot{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:none;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;font-size:15px;padding:0 16px;text-decoration:none}
.btn:hover{background:var(--teal-d)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-2{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn-2:hover{background:var(--mint)}
.btn-sm{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--teal);background:#fff;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-sm:hover{background:var(--mint)}
.btn-sm[aria-pressed="true"]{background:var(--teal);color:#fff}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:#8F1C13}
.link{border:none;background:none;color:var(--blue);font-weight:700;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card + .card{margin-top:12px}
.card-teal{background:var(--teal);color:#fff;border:none}
.card-dark{background:var(--teal-d);color:#fff;border:none}
.card-mint{background:var(--mint);border-color:#C7D8F2}
.card-amber{background:var(--amber-bg);border-color:#F3DBA8;color:#4A3000}
.note{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.note.warn{background:var(--amber-bg);color:#4A3000}
.note.info{background:var(--mint);color:#0E2A55}
.note + .note{margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-wait{background:var(--amber-bg);color:var(--amber-ink)}
.b-todo{background:#EDF1F7;color:#47526A}
.b-rec{background:var(--amber);color:#3B2600}
.b-req{background:#FBE3E1;color:#8F1C13}

.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.field label,.label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid #C3CDDD;border-radius:12px;background:#fff;padding:10px 14px}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(11,92,173,.22)}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;margin-top:4px}
.err:empty{display:none}
.hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.pw{position:relative}
.pw input{padding-right:52px}
.pw .iconbtn{position:absolute;right:2px;top:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--teal);flex:none}
.affix{position:relative}
.affix > span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none;font-size:14px}
.affix input{padding-left:44px !important}
.affix.suf > span{left:auto;right:14px}
.affix.suf input{padding-left:14px !important;padding-right:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 14px;border-radius:12px;border:1.5px solid #C3CDDD;background:#fff;font-size:14px;font-weight:600;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--mint);color:var(--teal-d)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:58px;padding:10px 14px;border-radius:14px;border:1.5px solid #C3CDDD;background:#fff;text-align:left}
.opt small{color:var(--muted);font-weight:500;font-size:12.5px}
.opt b{font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E2E8F2;border-radius:12px;padding:4px;gap:4px;margin:4px 0 14px}
.seg button{min-height:40px;border:none;border-radius:9px;background:none;font-weight:700;color:var(--muted);font-size:14px;padding:0 6px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--teal-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{display:flex;flex-direction:column;gap:3px;min-height:96px;padding:12px;border-radius:14px;border:1.5px solid #C3CDDD;background:#fff;text-align:left}
.pcard[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.pcard b{font-size:14px;line-height:1.3}
.pcard small{font-size:12px;color:var(--muted);line-height:1.35}
.tchip{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;border-radius:14px;border:1.5px solid #C3CDDD;background:#fff;text-align:left}
.tchip[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
.tbox{width:22px;height:22px;border-radius:6px;border:2px solid #98A3B8;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.tchip[aria-pressed="true"] .tbox{background:var(--teal);border-color:var(--teal)}

.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EBEFF6}
.li:last-child{border-bottom:none}
.menu .li{width:100%;border:none;border-bottom:1px solid #EBEFF6;background:none;text-align:left;min-height:56px;padding:12px 4px}
.menu .li:last-child{border-bottom:none}
.ibox{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.sub{font-size:13px;color:var(--muted)}
.price-line,.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #DCE3EE;font-size:14px}
.price-line:last-child,.kv:last-child{border-bottom:none}
.kv b,.price-line b{white-space:nowrap}
.total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;padding-top:12px}
.big{font-size:30px;font-weight:800;color:var(--blue);line-height:1.15}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#C8D6EE;margin-top:12px}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.law{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.lawchip{display:inline-flex;align-items:center;border:1px solid #BDD0EE;background:#F0F5FC;color:var(--teal-d);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;min-height:28px}
.lawchip:hover{background:var(--mint)}
.card-dark .lawchip,.card-teal .lawchip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.card-dark .law,.card-teal .law{color:#C9D6EE}

.bar{height:8px;background:#E2E8F2;border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--teal);border-radius:99px}
.card-teal .bar{background:rgba(255,255,255,.22)}
.card-teal .bar > span{background:var(--amber)}
.steps{list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.sdot{width:24px;height:24px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.s-done{background:var(--teal);color:#fff}
.s-now{background:var(--amber-bg);border:2px solid #B86E00}
.s-todo{border:2px solid #C3CDDD;background:#fff}
.card-teal .s-done{background:var(--amber);color:#3B2600}
.card-teal .s-todo{background:transparent;border-color:rgba(255,255,255,.5)}
.card-teal .sub{color:#C9D6EE}
.card-dark .sub{color:#C9D6EE}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .rail i{width:2px;flex:1;min-height:22px;background:#DCE3EE}
.tl .txt{padding-bottom:14px}

.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:96px;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;text-align:left;color:var(--ink)}
.qbtn .ic{color:var(--teal)}
.qbtn:hover{border-color:var(--teal)}
.qbtn b{font-size:14px}
.qbtn span{font-size:12.5px;color:var(--muted)}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid #EBEFF6;vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.tbl tr.me td{background:var(--mint)}

.welcome{display:flex;flex-direction:column;min-height:100%;padding:36px 22px 24px}
.ticks{list-style:none;padding:0;margin:20px 0 24px;display:flex;flex-direction:column;gap:10px}
.ticks li{display:flex;gap:10px;align-items:center;font-weight:600}
.ticks .ibox{width:30px;height:30px;border-radius:9px}

.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:none;background:none;font-size:11px;font-weight:700;color:#626E86;border-radius:12px;padding:6px 0}
.tab[aria-current="page"]{color:var(--teal)}
.tab[aria-current="page"] .ic{background:var(--mint);border-radius:10px;padding:2px 10px;width:44px}

.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg time{display:block;font-size:11px;opacity:.75;margin-top:3px}
.composer{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;min-height:46px;border:1.5px solid #C3CDDD;border-radius:14px;padding:0 14px;background:#fff;min-width:0}
.composer button{width:46px;height:46px;border:none;border-radius:14px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.composer-in{display:flex;gap:8px;width:100%;max-width:680px;margin:0 auto}

.lbl{border:2px dashed #8E9AB2;border-radius:14px;background:#fff;padding:14px}
.lbl .nm{font-size:19px;font-weight:800;line-height:1.2}
.lbl .jn{font-size:12.5px;color:var(--muted)}
.lbl .tx{font-size:12.5px;margin-top:6px}
.lbl .boxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lbl .boxes span{font-size:11px;font-weight:700;border:1px solid var(--ink);border-radius:6px;padding:3px 7px}
.cl{list-style:none;padding:0;margin:0}
.cl li{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
.cl li .ic{margin-top:2px}
.cl .y{color:var(--ok)}
.cl .n{color:#8893A8}

.backdrop{position:absolute;inset:0;background:rgba(12,22,48,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 24px;max-height:85%;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:99px;background:#D2DAE7;margin:4px auto 14px}
#toast{position:absolute;left:16px;right:16px;top:64px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#0F1C38;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:100%}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:99px;background:#98A3B8;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.metric b{display:block;font-size:24px;font-weight:800;color:var(--blue)}
.fakeqr{width:200px;height:200px;margin:8px auto;display:block;border:8px solid #fff;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.feat{display:flex;gap:12px;align-items:flex-start}
.feat + .feat{margin-top:14px;padding-top:14px;border-top:1px solid #EBEFF6}
.num{width:28px;height:28px;border-radius:99px;background:var(--teal);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}

.shell,.auth{flex:1;display:flex;min-height:0}
.main,.auth-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.content{width:100%;max-width:1120px;margin:0 auto}
.content.narrow{max-width:720px}
.content.auth-w{max-width:480px;min-height:100%;display:flex;flex-direction:column}
.sidebar,.auth-brand{display:none}
.grid-auto{display:flex;flex-direction:column;gap:12px}
.grid-auto > .card.card,.col > .card.card,.col > .note{margin-top:0}
.cols{display:flex;flex-direction:column;gap:12px}
.cols > *{min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){
  .grid-auto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pad{padding:0 28px}
}
@media (min-width:960px){
  .sidebar{display:flex;flex-direction:column;width:256px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto}
  .tabbar{display:none}
  .pad{padding:0 40px}
  .topbar{padding:20px 32px 10px;min-height:76px}
  .topbar .title{text-align:left;margin-right:0;font-size:22px;font-weight:800}
  .topbar.noback .title{font-size:24px}
  .grid-auto{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
  .cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sticky{position:sticky;top:96px}
  .backdrop{align-items:center;justify-content:center}
  .sheet{max-width:520px;border-radius:20px;padding:22px 26px}
  .grab{display:none}
  .auth-brand{display:flex;flex-direction:column;justify-content:space-between;width:42%;max-width:600px;background:var(--teal-d);color:#fff;padding:56px 56px 40px;overflow-y:auto}
  .auth-main .content.auth-w{justify-content:center}
  .welcome{min-height:auto;padding-top:56px}
  .composer-in{padding:0 28px}
  #toast{left:256px}
}
.snav{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:none;border-radius:12px;background:none;font-weight:700;font-size:15px;color:#47526A;text-align:left}
.snav:hover{background:var(--bg)}
.snav[aria-current="page"]{background:var(--mint);color:var(--teal-d)}
.brand-stat{border-top:1px solid rgba(255,255,255,.18);padding:16px 0}
.brand-stat b{display:block;font-size:30px;color:var(--amber);line-height:1.1}
</style>
</head>
<body>
<div class="device">
  <main id="app" aria-live="off"></main>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
(function () {
  /* =========================================================
     Yukizin v2 — mockup interaktif.
     - Tanpa backend, tanpa API. Semua data di memori (S) dan hilang saat dimuat ulang.
     - Kata sandi tidak disimpan. Isi berkas tidak dibaca, hanya nama & ukuran.
     - Semua teks pengguna di-escape sebelum ditampilkan.
     ========================================================= */
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');

  var REG = {
    PP28: { s: 'PP 28/2025', t: 'PP No. 28 Tahun 2025 tentang Penyelenggaraan Perizinan Berusaha Berbasis Risiko', d: 'Berlaku sejak 5 Juni 2025 dan menggantikan PP 5/2021. Menjadi acuan tunggal perizinan berbasis risiko di OSS: NIB sebagai legalitas usaha, dan SPP-IRT sebagai perizinan penunjang (PB UMKU).', f: ['Cek produk', 'Checklist: NIB', 'Panduan daftar'] },
    UMK: { s: 'PP 7/2021', t: 'PP No. 7 Tahun 2021 tentang Kemudahan, Pelindungan, dan Pemberdayaan KUMKM', d: 'Kriteria skala usaha (di luar tanah dan bangunan): mikro modal maks. Rp1 miliar atau omzet maks. Rp2 miliar/tahun; kecil modal >Rp1–5 miliar atau omzet >Rp2–15 miliar; menengah modal >Rp5–10 miliar atau omzet >Rp15–50 miliar.', f: ['Cek produk: skala usaha', 'Kalkulator: tarif BPOM'] },
    PB4: { s: 'Per BPOM 4/2024', t: 'Peraturan BPOM No. 4 Tahun 2024 tentang Pedoman Penerbitan SPP-IRT', d: 'SPP-IRT untuk pangan olahan IRT yang dikemas dan berlabel, umur simpan minimal 7 hari di suhu ruang, dan jenis pangannya tercantum di lampiran. Pasal 3 ayat (3): dikecualikan bagi pangan dengan umur simpan kurang dari 7 hari dan pangan siap saji. SPP-IRT terbit lewat OSS, lalu pelaku usaha memenuhi komitmen penyuluhan keamanan pangan dan pemeriksaan sarana dalam 3 bulan; bila 6 bulan tidak dipenuhi, SPP-IRT dapat dibekukan. Masa berlaku 5 tahun dan dapat diperpanjang.', f: ['Cek produk', 'Katalog izin', 'Checklist', 'Panduan SPP-IRT'] },
    CPPB: { s: 'CPPB-IRT', t: 'Peraturan Kepala BPOM No. HK.03.1.23.04.12.2206 Tahun 2012 tentang Cara Produksi Pangan yang Baik untuk IRT', d: 'Standar higiene, sanitasi, dan dokumentasi untuk dapur produksi rumah tangga. Menjadi acuan saat Dinas Kesehatan memeriksa sarana.', f: ['Checklist: pemeriksaan sarana'] },
    PB27: { s: 'Per BPOM 27/2017', t: 'Peraturan BPOM No. 27 Tahun 2017 tentang Pendaftaran Pangan Olahan (beserta perubahannya)', d: 'Dasar izin edar BPOM MD. Pendaftar wajib memiliki izin usaha untuk jenis pangan yang didaftarkan dan memenuhi CPPOB. Pendaftaran dilakukan per produk: beda jenis pangan, kemasan, atau komposisi didaftarkan terpisah. Usaha mikro dan kecil dikecualikan dari kewajiban hasil analisis zat gizi.', f: ['Cek produk', 'Katalog izin', 'Checklist BPOM', 'Panduan BPOM'] },
    PB22: { s: 'Per BPOM 22/2021', t: 'Peraturan BPOM No. 22 Tahun 2021 tentang Tata Cara Penerbitan Izin Penerapan CPPOB', d: 'Produsen pangan olahan wajib memiliki Izin Penerapan CPPOB sebelum mendaftarkan produk ke BPOM. Untuk usaha mikro dan kecil, penilaian dilakukan bertahap sesuai pedoman pemeriksaan sarana.', f: ['Katalog izin: CPPOB', 'Checklist BPOM'] },
    PP15: { s: 'PP 15/2026', t: 'PP No. 15 Tahun 2026 tentang Jenis dan Tarif PNBP pada BPOM', d: 'Mulai 26 Mei 2026, tarif registrasi pangan olahan Rp0 untuk produsen dalam negeri skala mikro dan kecil (produk MD). Tidak perlu permohonan khusus, asalkan skala usaha di OSS dan akun e-reg BPOM sama. Skala menengah, besar, dan importir tetap membayar sesuai lampiran tarif.', f: ['Kalkulator biaya', 'Katalog izin: BPOM MD'] },
    LABEL: { s: 'Per BPOM 31/2018 jo. 20/2021 jo. 6/2024', t: 'Peraturan BPOM tentang Label Pangan Olahan beserta perubahan pertama dan kedua', d: 'Label paling sedikit memuat: nama produk, daftar bahan, berat bersih atau isi bersih, nama dan alamat produsen, halal (bila sudah bersertifikat), tanggal dan kode produksi, keterangan kedaluwarsa, nomor izin edar, dan asal usul bahan tertentu. Ditulis dalam bahasa Indonesia, jelas, dan mudah dibaca (huruf minimal setara 1 mm).', f: ['Pembuat label', 'Checklist: label'] },
    ING: { s: 'Per BPOM 26/2021', t: 'Peraturan BPOM No. 26 Tahun 2021 tentang Informasi Nilai Gizi pada Label Pangan Olahan', d: 'Mengatur tabel informasi nilai gizi (ING). Usaha mikro dan kecil memiliki ketentuan ING tersendiri, sehingga uji proksimat tidak selalu wajib.', f: ['Kalkulator: uji gizi'] },
    MIKRO: { s: 'Per BPOM 13/2019', t: 'Peraturan BPOM No. 13 Tahun 2019 tentang Batas Maksimal Cemaran Mikroba dalam Pangan Olahan', d: 'Acuan parameter dan batas uji mikrobiologi per kategori pangan, misalnya angka lempeng total, kapang dan khamir, E. coli, Salmonella, dan S. aureus.', f: ['Kalkulator: pilihan uji', 'Hasil uji'] },
    HALAL: { s: 'PP 42/2024 (diubah Okt 2026)', t: 'UU 33/2014 tentang Jaminan Produk Halal, PP 42/2024 dan perubahannya', d: 'Pada 17 Oktober 2026 pemerintah memperpanjang masa penahapan: produk makanan dan minuman usaha mikro dan kecil wajib bersertifikat halal paling lambat 17 Oktober 2028. Usaha menengah dan besar sudah wajib sejak Oktober 2024. Pengajuan lewat SIHALAL (ptsp.halal.go.id): jalur self-declare (program SEHATI, gratis sesuai kuota) atau reguler. Logo halal baru boleh dicantumkan setelah sertifikat terbit.', f: ['Cek produk', 'Katalog izin: halal', 'Checklist: halal', 'Kalkulator'] },
    SNI: { s: 'SNI wajib', t: 'Peraturan Menteri Perindustrian tentang pemberlakuan SNI secara wajib', d: 'Beberapa produk pangan wajib memiliki SPPT-SNI sebelum beredar, misalnya air minum dalam kemasan. Cek daftar produk SNI wajib sebelum produksi.', f: ['Katalog izin: SNI'] }

    planSave: function () { S.onboarded = true; toast('Rencana disimpan. Ikuti langkah di beranda.'); go('home', {}, { reset: true }); },
    izinTab: function (a) { S.izinTab = a; render(); },
    izinDetail: function (a) { go('izinDetail', { id: a }); },
    izinAturan: function () { S.izinTab = 'aturan'; go('izin', {}, { reset: true }); },
    reg: function (a) { S.sheet = 'reg'; S.sheetArg = a; keepScroll(); },
    biayaTab: function (a) { S.biayaTab = a; render(); },
    calcMode: function (a) { S.calc.mode = a; keepScroll(); },
    calcTest: function (a) { S.calc.tests[a] = !S.calc.tests[a]; keepScroll(); },
    calcHalal: function (a) { S.calc.halal = a; keepScroll(); },
    toCheckout: function () { if (!calcRes().sel.length) { toast('Pilih minimal satu uji.'); return; } if (!S.cart.produk && S.label.nama) S.cart.produk = S.label.nama; go('checkout'); },
    pickSlot: function (a) { S.cart.slot = a; keepScroll(); },
    pickPay: function (a) { S.cart.bayar = a; keepScroll(); },
    paid: function (_, el) {
      el.disabled = true; el.textContent = 'Memproses…';
      setTimeout(function () {
        var r = calcRes(), id = 'SE-' + String(Math.floor(1000 + Math.random() * 9000));
        var o = { id: id, tests: r.sel.map(function (t) { return t.id; }), total: r.lab + num(S.calc.ongkir), units: r.units, produk: S.cart.produk.trim(), tanggal: S.cart.tanggal, slot: S.cart.slot, created: stamp(), st: 1, log: ['Dibuat ' + stamp(), 'Dibayar ' + stamp()] };
        S.orders.unshift(o); S.biayaTab = 'pesanan';
        notify('Pembayaran pesanan ' + id + ' diterima (simulasi).');
        S.cart = { produk: '', alamat: '', tanggal: '', slot: '', bayar: 'qris' };
        go('success', { id: id }, { reset: true });
      }, 700);
    },
    order: function (a) { go('order', { id: a }); },
    hasil: function (a) { go('hasil', { id: a }); },
    advance: function (a) {
      var o = S.orders.find(function (x) { return x.id === a; }); if (!o || o.st >= FLOW.length - 1) return;
      o.st++; o.log[o.st] = stamp();
      if (o.st >= FLOW.length - 1) { S.files.ujilab = { name: 'Laporan uji ' + o.id + ' (contoh).pdf', size: 0 }; notify('Hasil uji ' + o.id + ' terbit dan otomatis masuk ke checklist berkas.'); }
      else notify(o.id + ': ' + FLOW[o.st] + '.');
      keepScroll();
    },
    download: function () { toast('Simulasi: di aplikasi nyata, laporan diunduh di sini.'); },
    docCheck: function (a) { S.checks[a] = !S.checks[a]; keepScroll(); },
    removeFile: function (a) { delete S.files[a]; toast('Berkas dihapus dari daftar.'); keepScroll(); },
    allergen: function (a) {
      var L = S.label, i = L.alergen.indexOf(a);
      if (a === 'Tidak ada') L.alergen = i > -1 ? [] : ['Tidak ada'];
      else { L.alergen = L.alergen.filter(function (x) { return x !== 'Tidak ada'; }); var j = L.alergen.indexOf(a); if (j > -1) L.alergen.splice(j, 1); else L.alergen.push(a); }
      if (L.status === 'ok') L.status = 'draft'; keepScroll();
    },
    guide: function (a) { var k = curPath() + a; S.guide[k] = !S.guide[k]; if (guideDone()) notify('Semua langkah pendaftaran sudah ditandai selesai.'); keepScroll(); },
    quick: function (a) { sendChat(a); },
    sheet: function (a) { S.sheet = a; keepScroll(); },
    closeSheet: function () { S.sheet = null; keepScroll(); },
    book: function (a) { S.sheet = null; notify('Panggilan video dijadwalkan: ' + a + ' (simulasi).'); S.chat.push({ me: false, t: 'Jadwal panggilan video kita: ' + a + '. Sampai jumpa!', time: stamp() }); render(); toast('Panggilan dijadwalkan.'); },
    togglePlus: function () { S.plus = !S.plus; if (S.plus) notify('Yukizin Plus aktif (simulasi, tanpa tagihan).'); toast(S.plus ? 'Yukizin Plus aktif (simulasi).' : 'Yukizin Plus dinonaktifkan.'); keepScroll(); },
    forgot: function () { toast('Di versi demo, atur ulang kata sandi hanya simulasi.'); },
    togglePass: function (id, el) { var i = document.getElementById(id); if (!i) return; var show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.setAttribute('aria-pressed', String(show)); el.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'); el.innerHTML = I(show ? 'eyeoff' : 'eye'); },
    demoLogin: function () {
      S.user = { nama: 'Rina', usaha: 'Dapur Rina', kontak: 'demo@contoh.id' };
      if (!S.plan) {
        S.ans = { produk: 'keripik', proses: 'biasa', simpan: 'sedang', pasar: 'oleh', skala: 'mikro', punya: ['nib'], kota: 'Kabupaten Sumedang' };
        S.plan = buildPlan(S.ans); applyPlanToCalc();
        S.calc.bahan = '450000'; S.calc.unit = '120'; S.calc.tenaga = '120000'; S.calc.kemasan = '1500'; S.calc.berat = '100'; S.calc.harga = '15000';
        S.label.nama = 'Keripik Tempe Pedas'; S.label.jenis = 'Keripik tempe'; S.label.berat = '100 g';
      }
      afterAuth('Masuk dengan akun demo.');
    },
    logout: function () { S.lastUser = S.user; S.user = null; S.sheet = null; S.onboarded = false; go('welcome', {}, { reset: true }); toast('Anda sudah keluar.'); },
    reset: function () { S = freshState(); render(); toast('Data demo sudah diatur ulang.'); }
  };

  /* ---------- Formulir ---------- */
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var PHONE = /^(\+62|62|0)8[0-9]{7,12}$/;
  function busy(form, done) { var b = form.querySelector('[type="submit"]'); if (b) { b.disabled = true; b.textContent = 'Memproses…'; } setTimeout(done, 600); }
  var FORMS = {
    register: function (f) {
      var v = { nama: f.nama.value.trim(), usaha: f.usaha.value.trim(), kontak: f.kontak.value.trim().replace(/\s|-/g, '') }, e = {};
      if (v.nama.length < 2) e.nama = 'Isi nama minimal 2 huruf.';
      if (v.usaha.length < 2) e.usaha = 'Isi nama usaha.';
      if (!EMAIL.test(v.kontak) && !PHONE.test(v.kontak)) e.kontak = 'Masukkan email atau nomor HP yang valid, misalnya 0812xxxxxxx.';
      if (f.pass.value.length < 8) e.pass = 'Kata sandi minimal 8 karakter.';
      if (!f.setuju.checked) e.setuju = 'Centang persetujuan untuk melanjutkan.';
      if (!showErrors(f, e)) return;
      f.pass.value = '';
      busy(f, function () { S.user = v; afterAuth('Akun demo berhasil dibuat.'); });
    },
    login: function (f) {
      var k = f.kontak.value.trim().replace(/\s|-/g, ''), e = {};
      if (!EMAIL.test(k) && !PHONE.test(k)) e.kontak = 'Masukkan email atau nomor HP yang valid.';
      if (f.pass.value.length < 8) e.pass = 'Kata sandi minimal 8 karakter.';
      if (!showErrors(f, e)) return;
      f.pass.value = '';
      busy(f, function () { S.user = S.lastUser && S.lastUser.kontak === k ? S.lastUser : { nama: 'Pengguna Demo', usaha: 'Usaha Anda', kontak: k }; afterAuth('Berhasil masuk.'); });
    },
    checkout: function (f) {
      var e = {};
      if (S.cart.produk.trim().length < 2) e.produk = 'Isi nama produk.';
      if (S.cart.alamat.trim().length < 8) e.alamat = 'Isi alamat penjemputan.';
      if (!S.cart.tanggal) e.tanggal = 'Pilih tanggal.'; else if (S.cart.tanggal < tomorrowISO()) e.tanggal = 'Pilih tanggal mulai besok.';
      if (!S.cart.slot) e.slot = 'Pilih waktu.';
      if (!showErrors(f, e)) return;
      go('pay');
    },
    label: function () {
      var miss = labelChecks().filter(function (c) { return !c[1]; });
      if (miss.length) { toast('Lengkapi dulu: ' + miss.map(function (m) { return m[0].toLowerCase(); }).join(', ') + '.'); return; }
      S.label.status = 'review'; keepScroll(); toast('Label lolos cek otomatis, dikirim ke pendamping.');
      setTimeout(function () {
        S.label.status = 'ok';
        notify('Pendamping menyetujui rancangan label. Tambahkan nomor izin setelah terbit.');
        if (S.route === 'label') keepScroll();
      }, 1600);
    },
    chat: function (f) { var t = f.msg.value; f.msg.value = ''; sendChat(t); }
  };

  /* ---------- Event ---------- */
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    if (el.classList.contains('backdrop') && ev.target.closest('[data-stop]')) return;
    var act = el.getAttribute('data-act');
    if (ACT[act]) { ev.preventDefault(); ACT[act](el.getAttribute('data-arg'), el); }
  });
  app.addEventListener('submit', function (ev) { ev.preventDefault(); var f = ev.target, name = f.getAttribute('data-form'); if (FORMS[name]) FORMS[name](f); });
  app.addEventListener('input', function (ev) {
    var t = ev.target, b = t.getAttribute('data-bind'), live = t.getAttribute('data-live');
    if (b) {
      setPath(S, b, t.value);
      if (t.getAttribute('aria-invalid') === 'true') { t.setAttribute('aria-invalid', 'false'); var er = app.querySelector('[data-err="' + t.name + '"]'); if (er) er.textContent = ''; }
    }
    if (live === 'search') { S.q = t.value; document.getElementById('plist').innerHTML = productList(); }
    if (live === 'calc') { var out = document.getElementById('calc-out'); if (out) out.innerHTML = calcOut(); }
    if (live === 'label') {
      if (S.label.status === 'ok') S.label.status = 'draft';
      document.getElementById('label-preview').innerHTML = labelPreview();
      document.getElementById('label-check').innerHTML = labelChecklist();
    }
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.tagName === 'SELECT' && t.getAttribute('data-bind')) setPath(S, t.getAttribute('data-bind'), t.value);
    var a2 = t.getAttribute('data-act2');
    if (a2) { S.calc[a2] = t.checked; var out = document.getElementById('calc-out'); if (out) out.innerHTML = calcOut(); }
    var docId = t.getAttribute('data-doc');
    if (docId && t.files && t.files[0]) {
      var file = t.files[0], okType = /\.(pdf|jpe?g|png)$/i.test(file.name), name = file.name.slice(0, 80), size = file.size;
      t.value = '';
      if (!okType) { toast('Format tidak didukung. Gunakan PDF, JPG, atau PNG.'); return; }
      if (size > 5 * 1024 * 1024) { toast('Ukuran maksimal 5 MB.'); return; }
      S.files[docId] = { name: name, size: size }; notify('Berkas "' + name + '" ditambahkan.'); toast('Berkas ditambahkan (hanya di perangkat ini).'); keepScroll();
    }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.sheet) { S.sheet = null; keepScroll(); } });

  render();
})();
</script>
</body>
</html>
